name: Update contribution battle

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Generate light and dark battle boards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER_NAME: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate-pokemon-battle.py pokemon-battle.svg
          python3 scripts/generate-pokemon-battle.py pokemon-battle-dark.svg

      - name: Commit updated boards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution battle"
          file_pattern: "pokemon-battle.svg pokemon-battle-dark.svg"
